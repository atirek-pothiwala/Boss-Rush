<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0d0d12;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #unity-canvas {
        background: #0d0d12;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(360px, 80vw);
        text-align: center;
      }
      #unity-logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 18px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 9px;
        background: linear-gradient(90deg, #7c5cff, #4fd1c5);
        transition: width 0.1s ease;
      }
      #unity-footer {
        position: absolute;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        opacity: 0.65;
      }
      #unity-warning {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90vw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">BOSS RUSH</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">{{{ PRODUCT_NAME }}} · {{{ PRODUCT_VERSION }}}</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBanner.style.display = type === "error" ? "block" : "none";
        warningBanner.innerHTML = msg;
      }

      // Resolve paths relative to the deployed folder (works on GitHub Pages project sites).
      var pagePath = window.location.pathname;
      var basePath = pagePath.substring(0, pagePath.lastIndexOf("/") + 1);
      var buildUrl = basePath + "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";

      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: basePath + "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      } else {
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function () {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
