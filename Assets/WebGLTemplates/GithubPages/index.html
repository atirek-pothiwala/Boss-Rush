<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        background: #0d0d12;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #rotate-prompt {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px 24px;
        text-align: center;
        background: #0d0d12;
      }
      #rotate-prompt .rotate-icon {
        font-size: clamp(40px, 12vw, 56px);
        line-height: 1;
        opacity: 0.9;
      }
      #rotate-prompt .rotate-title {
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #rotate-prompt .rotate-body {
        max-width: 28rem;
        font-size: clamp(14px, 3.8vw, 18px);
        line-height: 1.5;
        opacity: 0.8;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #unity-canvas {
        background: #0d0d12;
        display: block;
        outline: none;
        max-width: 100%;
        max-height: 100%;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, 72vw);
        text-align: center;
        z-index: 2;
      }
      #unity-logo {
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 18px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 9px;
        background: linear-gradient(90deg, #7c5cff, #4fd1c5);
        transition: width 0.1s ease;
      }
      #unity-footer {
        position: absolute;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 100%;
        text-align: center;
        font-size: clamp(11px, 2.5vw, 12px);
        opacity: 0.65;
        pointer-events: none;
      }
      #unity-warning {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        max-width: min(90vw, 42rem);
        text-align: center;
        z-index: 3;
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(255, 80, 80, 0.15);
        border: 1px solid rgba(255, 80, 80, 0.4);
        font-size: clamp(13px, 3.5vw, 14px);
        line-height: 1.4;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="rotate-prompt" aria-live="polite">
      <div class="rotate-icon" aria-hidden="true">↻</div>
      <p class="rotate-title">Rotate your device</p>
      <p class="rotate-body">Boss Rush is designed for landscape mode. Turn your phone sideways to play.</p>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">BOSS RUSH</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">{{{ PRODUCT_NAME }}} · {{{ PRODUCT_VERSION }}}</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var rotatePrompt = document.querySelector("#rotate-prompt");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var gameWidth = {{{ WIDTH }}};
      var gameHeight = {{{ HEIGHT }}};
      var gameAspect = gameWidth / gameHeight;

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function isPortrait() {
        return window.innerHeight > window.innerWidth;
      }

      function showError(msg) {
        loadingBar.style.display = "none";
        warningBanner.style.display = "block";
        warningBanner.innerHTML = msg;
      }

      function unityShowBanner(msg, type) {
        if (type === "error") {
          showError(msg);
        }
      }

      function updateLayout() {
        var portrait = isPortrait();
        rotatePrompt.style.display = portrait ? "flex" : "none";
        container.style.display = portrait ? "none" : "flex";

        if (portrait) {
          return;
        }

        var viewWidth = window.innerWidth;
        var viewHeight = window.innerHeight;
        var viewAspect = viewWidth / viewHeight;
        var cssWidth;
        var cssHeight;

        if (viewAspect > gameAspect) {
          cssHeight = viewHeight;
          cssWidth = viewHeight * gameAspect;
        } else {
          cssWidth = viewWidth;
          cssHeight = viewWidth / gameAspect;
        }

        canvas.style.width = cssWidth + "px";
        canvas.style.height = cssHeight + "px";
      }

      updateLayout();
      window.addEventListener("resize", updateLayout);
      window.addEventListener("orientationchange", function () {
        setTimeout(updateLayout, 100);
      });

      // Resolve paths relative to the deployed folder (works on GitHub Pages project sites).
      var pagePath = window.location.pathname;
      var basePath = pagePath.substring(0, pagePath.lastIndexOf("/") + 1);
      var buildUrl = basePath + "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";

      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: basePath + "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      if (typeof WebAssembly !== "object") {
        showError("This browser does not support WebAssembly. Try updating your browser or use a desktop device.");
      } else {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onerror = function () {
          showError("Failed to load the game. Check your connection and try again.");
        };
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function () {
            loadingBar.style.display = "none";
            updateLayout();
          }).catch(function (message) {
            var hint = isMobile
              ? " Mobile browsers need a recent version of Safari (iOS 15+) or Chrome (Android). Try desktop if loading keeps failing."
              : "";
            showError(String(message) + hint);
          });
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
