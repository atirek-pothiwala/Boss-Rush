name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Compile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD repository secrets."
            echo "Add them at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Activate Unity Personal license
        id: unity-activate
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_VERSION: 6000.4.3f1
        run: bash .github/scripts/activate-unity-personal-ci.sh

      - name: Upload activation file on failure
        if: failure() && steps.unity-activate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: Unity_v*.alf
          if-no-files-found: ignore

      - name: Verify Unity license
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          projectPath: .
          testMode: EditMode
          customParameters: -nographics -batchmode

      - name: Build StandaloneLinux64
        id: unity-build
        if: github.ref == 'refs/heads/main'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          targetPlatform: StandaloneLinux64
          buildName: BossRush
          buildsPath: build

      - name: Return Unity license
        if: always() && steps.unity-tests.outcome == 'success'
        uses: game-ci/unity-return-license@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
