name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Compile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD repository secrets."
            echo "Add them at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Export license for GameCI
        run: |
          LICENSE_FILE=$(find /tmp "${RUNNER_TEMP}" "${HOME}/.local/share/unity3d/Unity" -name 'Unity_lic.ulf' 2>/dev/null | head -1)
          if [ -z "$LICENSE_FILE" ] || [ ! -f "$LICENSE_FILE" ]; then
            echo "::error::Could not find Unity_lic.ulf after online activation."
            exit 1
          fi
          {
            echo 'UNITY_LICENSE<<UNITY_LICENSE_EOF'
            cat "$LICENSE_FILE"
            echo 'UNITY_LICENSE_EOF'
          } >> "$GITHUB_ENV"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          projectPath: .
          testMode: EditMode
          customParameters: -nographics -batchmode

      - name: Build StandaloneLinux64
        id: unity-build
        if: github.ref == 'refs/heads/main'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          targetPlatform: StandaloneLinux64
          buildName: BossRush
          buildsPath: build

      - name: Return Unity license
        if: always() && steps.unity-tests.outcome == 'success'
        uses: game-ci/unity-return-license@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
