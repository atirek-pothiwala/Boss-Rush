name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Compile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ENTITLEMENT_LICENSE: ${{ secrets.UNITY_ENTITLEMENT_LICENSE }}
        run: bash .github/scripts/validate-unity-secrets.sh

      - name: Prepare Unity license
        id: unity-license
        env:
          UNITY_ENTITLEMENT_LICENSE: ${{ secrets.UNITY_ENTITLEMENT_LICENSE }}
        run: bash .github/scripts/prepare-unity-license.sh

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build StandaloneLinux64
        id: unity-build
        if: github.ref == 'refs/heads/main'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          targetPlatform: StandaloneLinux64
          buildName: BossRush
          buildsPath: build
          skipActivation: ${{ steps.unity-license.outputs.skip_activation == 'true' }}
