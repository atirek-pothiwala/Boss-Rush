name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: bash .github/scripts/validate-unity-secrets.sh

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-6000.4.3f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-v5
          restore-keys: |
            Library-WebGL-6000.4.3f1-

      - name: Build WebGL
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.3f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: WebGL
          versioning: None
          runAsHostUser: true

      - name: Prepare GitHub Pages artifact
        if: steps.unity-build.outcome == 'success'
        run: |
          # game-ci outputs to build/WebGL/WebGL when buildName matches the platform folder
          BUILD_OUTPUT="build/WebGL/WebGL"
          SITE_ROOT="build/pages-site"
          if [ ! -f "$BUILD_OUTPUT/index.html" ]; then
            echo "Expected WebGL build output at $BUILD_OUTPUT"
            find build -name index.html
            exit 1
          fi
          mkdir -p "$SITE_ROOT"
          cp -r "$BUILD_OUTPUT"/* "$SITE_ROOT/"
          touch "$SITE_ROOT/.nojekyll"
          cp README.md "$SITE_ROOT/README.md" || true
          # Redirect old /WebGL/ bookmarks to the site root
          mkdir -p "$SITE_ROOT/WebGL"
          cat > "$SITE_ROOT/WebGL/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Boss Rush</title>
              <script>
                location.replace(location.pathname.replace(/\/WebGL\/?$/, "/") + location.search + location.hash);
              </script>
            </head>
            <body>
              <p><a href="../">Open Boss Rush</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: steps.unity-build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
